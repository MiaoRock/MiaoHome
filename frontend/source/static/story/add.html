---
layout: false
---
<div class="miao-card">
    <div class="story-add-body">
        <label for="story-add-story">Story</label>
        <input id="story-add-story" type="text" placeholder="请输入Story">
        <label for="story-add-title">title</label>
        <input id="story-add-title" type="text" placeholder="请输入title">
        <label for="story-add-date">date</label>
        <input id="story-add-date" type="date">
        <label for="story-add-content">content</label>
        <textarea id="story-add-content" placeholder="请输入content"></textarea>
    </div>
    <div class="story-add-footer">
        <div id="story-add-message"></div>
        <button id="story-add-submit" class="miao-btn" type="button">保存</button>
        <button id="story-add-close" class="miao-btn" type="button">关闭</button>
    </div>
</div>
