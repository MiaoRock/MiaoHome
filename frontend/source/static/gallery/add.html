---
layout: false
---
<div class="miao-card">
    <div class="gallery-add-body">
        <label class="gallery-add-select" for="gallery-add-file">
            <input id="gallery-add-file" type="file" accept="image/*" multiple>
            <div class="gallery-add-select-icon"></div>
        </label>
        <div id="gallery-add-info">未选择图片</div>
    </div>
    <div class="gallery-add-footer">
        <div id="gallery-add-message"></div>
        <button id="gallery-add-submit" class="miao-btn" type="button">上传</button>
        <button id="gallery-add-close" class="miao-btn" type="button">关闭</button>
    </div>
</div>
